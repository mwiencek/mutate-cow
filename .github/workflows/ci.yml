name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn flow check
      - run: yarn tsd
